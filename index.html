<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krishna Leela Games</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="debug-fallback" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#1a1a2e;color:#00ff88;font-family:monospace;font-size:28px;padding:40px;z-index:99999;overflow:auto;">
      <h1 style="color:#ff3366;">App failed to load</h1>
      <pre id="debug-error" style="white-space:pre-wrap;margin-top:20px;"></pre>
    </div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('debug-fallback');
        var pre = document.getElementById('debug-error');
        el.style.display = 'block';
        pre.textContent += 'ERROR: ' + msg + '\nFile: ' + src + ':' + line + ':' + col + '\n\n';
      };
      setTimeout(function() {
        var root = document.getElementById('root');
        if (!root.children.length) {
          var el = document.getElementById('debug-fallback');
          var pre = document.getElementById('debug-error');
          el.style.display = 'block';
          pre.textContent += 'Root element is empty after 10s — React did not mount.\n';
          pre.textContent += 'Memory: ' + (navigator.deviceMemory || 'unknown') + ' GB\n';
          pre.textContent += 'User Agent: ' + navigator.userAgent + '\n';
        }
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
