<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Debug Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: monospace;
      font-size: 24px;
      padding: 40px;
    }
    h1 { color: #00ff88; font-size: 48px; margin-bottom: 30px; }
    .box {
      background: #16213e;
      border: 2px solid #00ff88;
      padding: 20px;
      margin: 15px 0;
      border-radius: 8px;
    }
    .red { border-color: #ff3366; }
    .blue { border-color: #0f3460; }
    .grid {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    .grid .box { flex: 1; text-align: center; }
  </style>
</head>
<body>
  <h1>Phase 1: Basic HTML</h1>
  <div class="box">If you can read this, Chromium is rendering HTML + CSS fine.</div>
  <div class="box red">Screen test: this box should have a RED border.</div>
  <div class="box blue">Screen test: this box should have a BLUE border.</div>
  <div class="grid">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
    <div class="box">Box 4</div>
  </div>
  <div class="box" id="info"></div>
  <script>
    var el = document.getElementById('info');
    el.innerHTML = 'Screen: ' + screen.width + 'x' + screen.height
      + '<br>Window: ' + window.innerWidth + 'x' + window.innerHeight
      + '<br>DevicePixelRatio: ' + window.devicePixelRatio
      + '<br>Time: ' + new Date().toLocaleString();
  </script>
</body>
</html>
