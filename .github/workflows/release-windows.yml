name: Build Windows Offline Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-offline-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash .github/scripts/build-windows-release.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view temple-latest >/dev/null 2>&1; then
            gh release create temple-latest \
              --target "$GITHUB_SHA" \
              --title "Temple Offline Build" \
              --notes "Latest offline Windows build. Extract the ZIP and double-click Start Krishna Games.bat."
          fi
          gh release upload temple-latest krishna-games-windows.zip --clobber
